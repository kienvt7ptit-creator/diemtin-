<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Sales Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--ink:#1c140f;--brand:#b4532a;--muted:#6b6258}
body{margin:0;background:#f7f3ea;color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
.poster{max-width:560px;margin:24px auto;background:#fff;border-radius:20px;padding:36px 28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
h1{font-size:30px;line-height:1.2;margin:10px 0 6px}
p{margin:0;color:var(--muted)}
img{width:min(340px,80vw);height:auto;margin:22px auto 10px;display:block}
.url{font-size:13px;word-break:break-all;color:var(--muted)}
.steps{display:flex;justify-content:center;gap:18px;margin-top:22px;font-size:14px;flex-wrap:wrap}
.steps b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;margin-right:6px}
.print{display:block;margin:0 auto 24px;padding:12px 22px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 15px inherit;cursor:pointer}
@media print{body{background:#fff}.poster{box-shadow:none;margin:0 auto}.print{display:none}}
</style>
</head>
<body>
<div class="poster">
  <div class="eyebrow">Sales Lab · Bài test đầu vào</div>
  <h1>Quét mã để làm bài<br>30 câu kiến thức nền tảng</h1>
  <p>45 giây mỗi câu · đạt từ 24/30 · có lời giải sau mỗi câu</p>
  <img src="qr.svg" alt="Mã QR mở bài test">
  <div class="url">kienvt7ptit-creator.github.io/diemtin-/sales-test/</div>
  <div class="steps"><span><b>1</b>Mở camera</span><span><b>2</b>Quét mã</span><span><b>3</b>Nhập tên & làm bài</span></div>
</div>
<button class="print" onclick="print()">In / lưu PDF</button>
</body>
</html>
